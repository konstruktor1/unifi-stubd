version: 1
runner:
  name: unifi-stubd-code-checker
  id: "${RUNNER_ID}"
  lifecycle: ephemeral
base:
  tier: 1
  service: go
backend: overlay-image
resources: {}
image_setup:
  script: build-runner/toolsets/code-checker/image-setup.sh
  inputs:
    - build-runner/toolsets/code-checker/javascript
prepare:
  - export PATH="/opt/node/bin:/opt/unifi-stubd-code-checker-javascript/bin:$PATH"
validation:
  - go version
  - python3 --version
  - "node --version | grep -Fx 'v24.18.1'"
  - "npm --version | grep -Fx '11.16.0'"
  - "eslint --version | grep -Fx 'v10.8.0'"
  - "prettier --version | grep -Fx '3.9.6'"
  - shfmt --version
  - shellcheck --version
  - uname -srm
mounts:
  workspace:
    transport: bind
  artifacts:
    - name: code-checker-source
      direction: input
      transport: bind
      path:
        host_ref: CODE_CHECKER_SOURCE
      reason: Run the exact read-only Code Checker tool checkout against this consumer.
runtime_requirements: []
