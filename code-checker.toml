# Consumer-owned Code Checker configuration.
schema_version = 1
profile = "mandatory"
languages = ["go", "javascript", "bash"]
paradigms = ["procedural"]
architectures = ["modular-monolith"]
patterns = ["facade"]
missing_tools = "fail"
tool_resolution = "project-first"

exclude = [
  "build-runner/runtime/**",
  "code-checker/activate.local.sh",
]

[maintenance.anti_bloat]
enabled = true
