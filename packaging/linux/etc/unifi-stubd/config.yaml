# Packaged Linux starter config. Replace the documentation addresses with an
# isolated lab. Field behavior and examples:
# https://github.com/konstruktor1/unifi-stubd/blob/main/docs/en/operation-modes.md
operation_mode: stub
controller_url: http://192.0.2.10:8080/inform
profile: us8
profile_file: ""
profile_dir: ""
mac: auto
ip: 192.0.2.50
hostname: auto

link_speed: 0
uplink_speed: auto
uplink_port: 0
uplink_neighbor:
  mac: ""
  vlan: 1
  type: usw
port_neighbors: []
port_overrides: []

wan_health:
  source: off
  interval_seconds: 10
  timeout_ms: 1000
  targets: []

observe_interface: ""
observe_bridge: ""
bridge_observe:
  bridge: ""
  uplink_interface: ""
  ignored_members: []
  member_port_map: []
port_mappings: []
lldp_source: off
traffic_rates_enabled: false
proc_source: off

# Abort duplicate live instances before they open controller-facing services.
instance_guard: fail
instance_guard_path: /var/lib/unifi-stubd/instance.lock

interval_seconds: 10
controller_interval_min_seconds: 5
controller_interval_max_seconds: 60
inform_backoff_max_seconds: 300
inform_backoff_jitter_percent: 20
no_discovery: false
discovery_interface: ""
discovery_targets: []

management_lan:
  enabled: false
  vlan: 0
  network_name: ""
  mode: metadata-only
  interface: ""
  ip: ""
  controller_reachable: off
  adoption_strategy: untagged-first

# Keep the optional adoption SSH shim closed unless an isolated lab needs it.
ssh_listen: ""
ssh_user: ubnt
ssh_password: ubnt
ssh_host_key_path: /var/lib/unifi-stubd/ssh_host_rsa_key

state_path: /var/lib/unifi-stubd/adoption.env
status_path: /var/lib/unifi-stubd/status.json
