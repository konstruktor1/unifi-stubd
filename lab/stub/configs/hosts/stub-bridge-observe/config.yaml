# Temporary Docker integration host for read-only bridge observation.
operation_mode: bridge-observe
controller_url: http://unifi-controller:8080/inform
profile: us8
hostname: stub-bridge-observe
interval_seconds: 2
controller_interval_min_seconds: 2
controller_interval_max_seconds: 60
discovery_targets:
  - unifi-controller:10001

bridge_observe:
  bridge: stubbr0
  uplink_interface: uplink0

traffic_rates_enabled: true
