# Docker integration overlay for the controller-backed US8 product gate.

services:
  controller-adoption:
    build:
      context: ../..
      dockerfile: lab/stub/Dockerfile.controller-adoption
    image: ${UNIFI_STUB_CONTROLLER_HELPER_IMAGE:-unifi-stubd-controller-adoption:lab}
    networks:
      lab: {}

  stub-bridge-observe:
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        VERSION: ${UNIFI_STUBD_VERSION:-lab}
    image: ${UNIFI_STUB_IMAGE:-unifi-stubd:lab}
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    networks:
      lab:
        ipv4_address: ${UNIFI_STUB_BRIDGE_IP:-172.31.242.25}
    volumes:
      - stub-bridge-observe-state:/var/lib/unifi-stubd
      - type: bind
        source: ${UNIFI_STUB_DOCKER_HOST_LAB_DIR:-.}/configs
        target: /usr/local/share/unifi-stubd-lab/configs
        read_only: true
      - type: bind
        source: ${UNIFI_STUB_DOCKER_HOST_LAB_DIR:-.}/scripts
        target: /usr/local/lib/unifi-stubd-lab
        read_only: true
    environment:
      UNIFI_STUB_BRIDGE_MAC: ${UNIFI_STUB_BRIDGE_MAC:?set product MAC}
      UNIFI_STUB_BRIDGE_IP: ${UNIFI_STUB_BRIDGE_IP:?set product IP}
    entrypoint:
      - /bin/sh
      - /usr/local/lib/unifi-stubd-lab/run-bridge-observe.sh

volumes:
  stub-bridge-observe-state:
