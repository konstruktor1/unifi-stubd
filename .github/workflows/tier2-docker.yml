name: Controller Integration

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PROVIDER_CONSUMER_ROOT: ${{ github.workspace }}
  PROVIDER_CONSUMER_CONTEXT: '{"consumer_id":"unifi-stubd-github","persistence":".consumer-data","resources":[]}'

concurrency:
  group: unifi-stubd-tier2-docker
  cancel-in-progress: false

jobs:
  controller-adoption:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: sudo --preserve-env bash --noprofile --norc -e -o pipefail {0}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          clean: false
          persist-credentials: false

      - name: Prepare current Build Runner source
        id: providers
        uses: ./.github/actions/provider-setup
        with:
          build-runner-source: ${{ vars.BUILD_RUNNER_SOURCE_URL }}
          source-user: ${{ vars.PROVIDER_SOURCE_USERNAME }}
          source-token: ${{ secrets.PROVIDER_SOURCE_TOKEN }}

      - name: Preflight Build Runner
        uses: ./.github/actions/provider-preflight
        with:
          provider: build-runner
          initial-management-launcher: ${{ steps.providers.outputs.build-runner-launcher }}

      - name: Run Stable and RC product acceptance
        run: make integration-nonunifi-metrics
