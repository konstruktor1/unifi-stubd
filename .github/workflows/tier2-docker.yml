name: Controller Integration

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unifi-stubd-tier2-docker
  cancel-in-progress: false

jobs:
  controller-adoption:
    runs-on: [self-hosted, Linux, X64, docker-dmz, docker-engine, unifi-stubd]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6

      - name: Preflight Build Runner
        run: |
          set -eu
          : "${BUILD_RUNNER_DIR:?configure BUILD_RUNNER_DIR on the self-hosted runner}"
          test -x "$BUILD_RUNNER_DIR/build-runner"

      - name: Run Stable and RC product acceptance
        run: make integration-nonunifi-metrics

      - name: Record controller evidence
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            printf '## Controller Integration\n\n'
            printf -- '- Commit: %s\n' "$GITHUB_SHA"
            printf -- '- Runner: %s\n' "$RUNNER_NAME"
            printf -- '- Controller channels: latest published Stable and RC resolved at run start\n'
            printf -- '- Job status: %s\n' "$JOB_STATUS"
          } >> "$GITHUB_STEP_SUMMARY"
