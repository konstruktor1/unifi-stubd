name: Controller Integration

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unifi-stubd-tier2-docker
  cancel-in-progress: false

jobs:
  controller-adoption:
    runs-on: [self-hosted, Linux, X64, docker-dmz, docker-engine, unifi-stubd]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6

      - name: Preflight Build Runner
        run: |
          set -eu
          test -f ./build-runner/runtime/entry && test -x ./build-runner/runtime/entry && test ! -L ./build-runner/runtime/entry || {
            printf '%s\n' 'Build Runner provider owner must run no-argument runner prepare from this physical consumer root after actions/checkout' >&2
            exit 2
          }
          provider_root="$(./build-runner/runtime/entry --provider-root)"
          "$provider_root/bin/provider" status build-runner --json
          "$provider_root/bin/provider" check build-runner --json

      - name: Run Stable and RC product acceptance
        run: make integration-nonunifi-metrics
