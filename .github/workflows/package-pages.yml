name: Package Repositories

on:
  workflow_dispatch:
    inputs:
      version:
        description: Package version without leading v
        required: false
      package_release:
        description: Package release number
        required: false
        default: "1"
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build-packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Install repository tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev createrepo-c libarchive-tools pacman-package-manager zstd

      - name: Resolve package version
        id: package-version
        env:
          RAW_VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          set -eu
          case "$RAW_VERSION" in
            v[0-9]*)
              version="${RAW_VERSION#v}"
              ;;
            [0-9]*)
              version="$RAW_VERSION"
              ;;
            *)
              version="$(sed -n '1p' VERSION)"
              ;;
          esac
          test -n "$version"
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            test "$version" = "$(sed -n '1p' VERSION)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build Linux package artifacts
        env:
          PKG_VERSION: ${{ steps.package-version.outputs.version }}
          PACKAGE_RELEASE: ${{ inputs.package_release || '1' }}
        run: |
          set -eu
          PKG_RELEASE="$PACKAGE_RELEASE" PKG_GOARCH=amd64 make package
          PKG_RELEASE="$PACKAGE_RELEASE" PKG_GOARCH=arm64 make package

      - uses: actions/upload-artifact@v7
        with:
          name: linux-package-artifacts
          path: dist/packages/
          retention-days: 7

  build-freebsd-artifacts:
    runs-on: [self-hosted, Linux, X64, freebsd-pkg-builder]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Resolve package version
        id: package-version
        env:
          RAW_VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          set -eu
          case "$RAW_VERSION" in
            v[0-9]*)
              version="${RAW_VERSION#v}"
              ;;
            [0-9]*)
              version="$RAW_VERSION"
              ;;
            *)
              version="$(sed -n '1p' VERSION)"
              ;;
          esac
          test -n "$version"
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            test "$version" = "$(sed -n '1p' VERSION)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build FreeBSD package artifacts and pkg repositories
        env:
          PKG_VERSION: ${{ steps.package-version.outputs.version }}
          PACKAGE_RELEASE: ${{ inputs.package_release || '1' }}
          FREEBSD_PKG_REMOTE: unifi-stubd-freebsd-builder
          FREEBSD_PKG_BUILD_JAILS: ${{ vars.FREEBSD_PKG_BUILD_JAILS }}
          FREEBSD_PKG_REQUIRE_JAILS: "0"
        run: |
          set -eu
          PKG_RELEASE="$PACKAGE_RELEASE" make package-freebsd-pkg-repos
          tar -C dist/freebsd-pkg-repos -czf dist/freebsd-pkg-repos.tar.gz repo

      - uses: actions/upload-artifact@v7
        with:
          name: freebsd-package-artifacts
          path: dist/packages/
          retention-days: 7

      - uses: actions/upload-artifact@v7
        with:
          name: freebsd-pkg-repos
          path: dist/freebsd-pkg-repos.tar.gz
          retention-days: 7

  build-sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - run: mkdir -p dist

      - uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: dist/unifi-stubd.spdx.json

      - uses: actions/upload-artifact@v7
        with:
          name: release-sbom
          path: dist/unifi-stubd.spdx.json
          retention-days: 7

  build-and-deploy:
    needs:
      - build-packages
      - build-freebsd-artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6

      - name: Install repository tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev createrepo-c libarchive-tools pacman-package-manager zstd

      - uses: actions/download-artifact@v7
        with:
          name: linux-package-artifacts
          path: dist/packages

      - uses: actions/download-artifact@v7
        with:
          name: freebsd-package-artifacts
          path: dist/packages

      - uses: actions/download-artifact@v7
        with:
          name: freebsd-pkg-repos
          path: dist/freebsd-pkg-repos-archive

      - name: Extract native FreeBSD pkg repositories
        run: |
          mkdir -p dist/freebsd-pkg-repos
          tar -xzf dist/freebsd-pkg-repos-archive/freebsd-pkg-repos.tar.gz -C dist/freebsd-pkg-repos

      - name: Build static package repositories
        env:
          FREEBSD_PKG_REPO_DIR: dist/freebsd-pkg-repos/repo
        run: scripts/build-package-repos.sh

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/package-site

      - id: deployment
        uses: actions/deploy-pages@v5

  publish-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs:
      - build-packages
      - build-freebsd-artifacts
      - build-sbom
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: linux-package-artifacts
          path: dist/release

      - uses: actions/download-artifact@v7
        with:
          name: freebsd-package-artifacts
          path: dist/release

      - uses: actions/download-artifact@v7
        with:
          name: freebsd-pkg-repos
          path: dist/release

      - uses: actions/download-artifact@v7
        with:
          name: release-sbom
          path: dist/release

      - name: Create release checksums
        run: |
          set -eu
          cd dist/release
          sha256sum ./* > SHA256SUMS

      - name: Publish persistent release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -eu
          if ! gh release view "$RELEASE_TAG" --repo "$RELEASE_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --repo "$RELEASE_REPOSITORY" \
              --verify-tag \
              --title "unifi-stubd $RELEASE_TAG" \
              --prerelease \
              --generate-notes
          fi
          gh release upload "$RELEASE_TAG" \
            --repo "$RELEASE_REPOSITORY" \
            --clobber \
            dist/release/*
